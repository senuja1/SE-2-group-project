<!DOCTYPE html>
<html>
<head>
    <title>Add Products</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body onload="checkAuth(); loadBrands();">

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Inventory</h2>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/products.html">Products</a>
    <a class="active" href="/add-product.html">Add Products</a>
    <a href="/brands.html">Brands</a>
    <a href="/categories.html">Categories</a>
    <a onclick="logout()">Logout</a>
</div>

<!-- TOP BAR -->
<div class="topbar">
    <span>Add Products</span>
    <button onclick="logout()">Logout</button>
</div>

<!-- MAIN CONTENT -->
<div class="content">
    <h1>Add Products</h1>

    <!-- PHONE PRODUCTS -->
    <div class="form-card">
        <h3> Phone Products</h3>
        <input id="phoneName" placeholder="Phone Name">
        <input id="phoneQty" type="number" placeholder="Quantity">
        <input id="phonePrice" type="number" placeholder="Price (USD)">
        <select id="phoneBrand"></select>
        <button class="btn btn-primary" onclick="saveProduct('Phone')">Add Phone</button>
    </div>

    <!-- LAPTOP PRODUCTS -->
    <div class="form-card">
        <h3>Laptop Products</h3>
        <input id="laptopName" placeholder="Laptop Name">
        <input id="laptopQty" type="number" placeholder="Quantity">
        <input id="laptopPrice" type="number" placeholder="Price (USD)">
        <select id="laptopBrand"></select>
        <button class="btn btn-primary" onclick="saveProduct('Laptop')">Add Laptop</button>
    </div>

    <!-- DESKTOP PC PRODUCTS -->
    <div class="form-card">
        <h3> Desktop PC Products</h3>
        <input id="pcName" placeholder="PC Name">
        <input id="pcQty" type="number" placeholder="Quantity">
        <input id="pcPrice" type="number" placeholder="Price (USD)">
        <select id="pcBrand"></select>
        <button class="btn btn-primary" onclick="saveProduct('Desktop PC')">Add Desktop PC</button>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/add-products.js"></script>

</body>
</html>
