<!DOCTYPE html>
<html>
<head>
    <title>Categories</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body onload="checkAuth(); loadCategories();">

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Inventory Management</h2>
    <div class="admin">Welcome, admin</div>

    <a href="/dashboard.html">Dashboard</a>
    <a href="/products.html">Products</a>
    <a href="/brands.html">Brands</a>
    <a class="active" href="/categories.html">Categories</a>
    <a href="/api/report/pdf">Report</a>
    <a onclick="logout()">Logout</a>
</div>

<!-- TOP BAR -->
<div class="topbar">
    <span>Categories</span>
    <button onclick="logout()">Logout</button>
</div>

<!-- MAIN CONTENT -->
<div class="content">
    <h1>Categories</h1>

    <!-- ADD CATEGORY -->
    <div class="form-card">
        <input type="text" id="categoryName" placeholder="Category Name">
        <button class="btn btn-primary" onclick="addCategory()">Add Category</button>
    </div>

    <!-- CATEGORY TABLE -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Category Name</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="categoryTable">
        <!-- Loaded by JS -->
        </tbody>
    </table>
</div>

<!-- AUTH -->
<script src="/js/auth.js"></script>

<!-- PAGE SCRIPT -->
<script>
    function loadCategories() {
        fetch("/api/categories")
            .then(res => res.json())
            .then(data => {
                let rows = "";

                if (data.length === 0) {
                    rows = `
                        <tr>
                            <td colspan="3" style="text-align:center;color:#9ca3af;">
                                No categories found
                            </td>
                        </tr>
                    `;
                } else {
                    data.forEach(c => {
                        rows += `
                            <tr>
                                <td>${c.id}</td>
                                <td>${c.name}</td>
                                <td>
                                    <button class="btn btn-danger"
                                        onclick="deleteCategory(${c.id})">
                                        Delete
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }

                document.getElementById("categoryTable").innerHTML = rows;
            })
            .catch(() => {
                document.getElementById("categoryTable").innerHTML = `
                    <tr>
                        <td colspan="3" style="text-align:center;color:red;">
                            Failed to load categories
                        </td>
                    </tr>
                `;
            });
    }

    function addCategory() {
        const name = document.getElementById("categoryName").value.trim();

        if (!name) {
            alert("Category name required ");
            return;
        }

        fetch("/api/categories", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name })
        })
            .then(() => {
                document.getElementById("categoryName").value = "";
                loadCategories(); //
            });
    }

    function deleteCategory(id) {
        if (!confirm("Delete this category? ")) return;

        fetch(`/api/categories/${id}`, {
            method: "DELETE"
        })
            .then(() => loadCategories());
    }
</script>

</body>
</html>
